name: '📦 Publish Plugin Repository'

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build Jellyfin Plugin
        uses: oddstr13/jellyfin-plugin-repository-manager@v1.1.1
        id: jprm
        with:
          dotnet-target: "net10.0"
          jellyfin-version: "12.*-*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-plugin
          path: ${{ steps.jprm.outputs.artifact }}
          retention-days: 30

      - name: Update Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp ${{ steps.jprm.outputs.manifest }} manifest.json
          git add manifest.json
          git commit -m "Update manifest.json [skip ci]" || echo "No changes to manifest"
          git push origin main || echo "Nothing to push"
